<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HARIBOW 照明キューエディタ</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e8eaed; --sub:#9aa2b1; --accent:#6ea8ff; --accent2:#ffb26e;
    --danger:#ff6e6e; --ok:#6effa0;
    font-size:15px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  header h1{font-size:15px;font-weight:600;margin:0;color:var(--sub);letter-spacing:.02em;white-space:nowrap;}
  select,input[type=text],input[type=number]{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:6px 8px;font-size:13px;
  }
  button{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);color:#0f1115;border-color:var(--accent);font-weight:600;}
  button.danger{color:var(--danger);}
  .spacer{flex:1;}
  #status{font-size:12px;color:var(--sub);white-space:nowrap;}
  #status.err{color:var(--danger);}
  #status.ok{color:var(--ok);}

  main{padding:16px;max-width:1400px;margin:0 auto;}
  .row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}

  #waveWrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px;}
  #waveToolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  #waveToolbar .time{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px;}
  #timelineOuter{position:relative;overflow-x:auto;border-radius:6px;}
  canvas#wave{display:block;background:#0b0d12;border-radius:6px;cursor:crosshair;}
  #cueLayer{position:absolute;top:0;left:0;height:100%;pointer-events:none;}
  .cueMarker{
    position:absolute;top:0;width:2px;height:100%;background:var(--accent2);
    pointer-events:auto;cursor:ew-resize;
  }
  .cueMarker::before{
    content:'';position:absolute;top:-1px;left:-5px;width:12px;height:12px;
    background:var(--accent2);border-radius:2px;
  }
  .cueMarker.selected{background:var(--ok);}
  .cueMarker.selected::before{background:var(--ok);}
  .cueMarker .label{
    position:absolute;top:-20px;left:-4px;font-size:10px;color:var(--sub);
    white-space:nowrap;pointer-events:none;
  }

  #hint{font-size:12px;color:var(--sub);margin-top:6px;}

  #previewWrap{background:#000;border:1px solid var(--line);border-radius:8px;padding:0;margin-bottom:10px;overflow:hidden;position:relative;}
  canvas#preview{display:block;width:100%;height:180px;}
  #previewInfo{position:absolute;left:10px;bottom:8px;font-size:12px;color:#cfd6e6;text-shadow:0 1px 3px #000;}
  #previewInfo .part{font-weight:600;color:#fff;}
  #previewInfo .fixtures{margin-top:2px;}
  #previewInfo .fx{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:1px 6px;margin-right:4px;font-size:10.5px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;}
  #detailPanel{width:320px;flex:none;}
  #detailPanel h3{margin:0 0 10px;font-size:13px;color:var(--sub);font-weight:600;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11px;color:var(--sub);margin-bottom:3px;}
  .field input,.field textarea{width:100%;}
  .field textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font-size:13px;resize:vertical;min-height:50px;font-family:inherit;}
  .fieldRow{display:flex;gap:8px;}
  .fieldRow .field{flex:1;}
  #noSelection{color:var(--sub);font-size:13px;padding:20px 0;text-align:center;}

  #tableWrap{flex:1;min-width:480px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--sub);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:5px 8px;border-bottom:1px solid #1c202a;}
  tr.cueRow{cursor:pointer;}
  tr.cueRow:hover{background:var(--panel2);}
  tr.cueRow.selected{background:#22304a;}
  tr.cueRow td.num{font-variant-numeric:tabular-nums;color:var(--sub);}
  tr.cueRow.measured td.time{color:var(--ok);}
  .tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px;margin-right:3px;}
  .fxCheckGroup{display:flex;flex-wrap:wrap;gap:4px;}
  .fxCheckGroup label{
    display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;padding:4px 8px;font-size:12px;color:var(--text);cursor:pointer;
  }
  .fxCheckGroup label.checked{border-color:var(--accent2);background:#2a2416;color:var(--accent2);}
  .fxCheckGroup input{width:auto;margin:0;}
</style>
</head>
<body>

<header>
  <h1>HARIBOW 照明キューエディタ</h1>
  <select id="showSelect"><option value="">演目を選択…</option></select>
  <button id="newShowBtn">＋新規演目</button>
  <div class="spacer"></div>
  <input type="text" id="editorName" placeholder="あなたの名前" style="width:120px;">
  <span id="status"></span>
</header>

<main>
  <div id="waveWrap" style="display:none;">
    <div id="previewWrap">
      <canvas id="preview"></canvas>
      <div id="previewInfo">
        <div class="part" id="previewPart">—</div>
        <div class="fixtures" id="previewFixtures"></div>
      </div>
    </div>
    <div id="waveToolbar">
      <input type="file" id="audioFile" accept="audio/*">
      <span id="audioFileLabel" style="font-size:12px;color:var(--sub);"></span>
      <button id="playBtn">▶ 再生</button>
      <span class="time" id="timeLabel">0:00.00 / 0:00.00</span>
      <div class="spacer"></div>
      <button id="reloadBtn">再読込</button>
      <button id="saveBtn" class="primary">保存</button>
    </div>
    <div id="timelineOuter">
      <canvas id="wave" height="140"></canvas>
      <div id="cueLayer"></div>
    </div>
    <div id="hint">タイムライン上をクリックでその時刻にキュー追加／既存のマーカーはドラッグで移動。音源ファイルはローカルのものを選択するだけで、サーバーには送信されません（波形表示・再生用のみ）。一度選ぶとこのブラウザに記憶され、次回この演目を開いた時は自動で読み込まれます。</div>
  </div>

  <div class="row" id="editArea" style="display:none;">
    <div id="tableWrap" class="panel">
      <h3 style="margin:0 0 10px;font-size:13px;color:var(--sub);font-weight:600;">キュー一覧（<span id="cueCount">0</span>件）</h3>
      <div style="max-height:520px;overflow-y:auto;">
        <table>
          <thead><tr>
            <th>No</th><th>時刻</th><th>終了</th><th>パート</th><th>灯体</th><th>色</th><th>強度</th><th></th>
          </tr></thead>
          <tbody id="cueTableBody"></tbody>
        </table>
      </div>
      <button id="addCueBtn" style="margin-top:10px;">＋キューを追加（現在の再生位置）</button>
    </div>

    <div id="detailPanel" class="panel">
      <h3>キュー詳細</h3>
      <div id="noSelection">キューを選択してください</div>
      <div id="detailForm" style="display:none;">
        <div class="fieldRow">
          <div class="field"><label>時刻（秒）</label><input type="text" id="f_time"></div>
          <div class="field"><label>区間終了（秒・任意）</label><input type="text" id="f_timeEnd"></div>
        </div>
        <div class="field"><label>パート名</label><input type="text" id="f_part"></div>
        <div class="field"><label>灯体</label><div id="f_fixtures_group" class="fxCheckGroup"></div></div>
        <div class="fieldRow">
          <div class="field"><label>色</label><input type="text" id="f_color"></div>
          <div class="field"><label>強度</label><input type="text" id="f_intensity"></div>
        </div>
        <div class="field"><label>メモ</label><textarea id="f_memo"></textarea></div>
        <div class="field"><label><input type="checkbox" id="f_measured" style="width:auto;"> JUNYA実測</label></div>
        <button id="deleteCueBtn" class="danger">このキューを削除</button>
      </div>
    </div>
  </div>
</main>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyBhP557ISUfV4-laUz94wjo5OYXz_wds7O3J0CAsePjzgYhkzWHSYVsZ2Oaas36iJF1A/exec';

let state = {
  show: null, cues: [], selectedIdx: -1, baseVersion: '',
  audioBuffer: null, duration: 0, isPlaying: false, playStart: 0, playOffset: 0,
  pxPerSec: 40
};

const $ = (id) => document.getElementById(id);

function setStatus(msg, cls){
  const el = $('status'); el.textContent = msg; el.className = cls || '';
  if (cls === 'ok') setTimeout(() => { if (el.textContent === msg) el.textContent=''; }, 3000);
}

function fmtTime(s){
  s = Number(s)||0;
  const m = Math.floor(s/60), r = s - m*60;
  return m + ':' + r.toFixed(2).padStart(5,'0');
}

async function api(action, params, method, body){
  if (method === 'POST'){
    const res = await fetch(API, { method:'POST', body: JSON.stringify(Object.assign({action}, body)) });
    return res.json();
  }
  const qs = new URLSearchParams(Object.assign({action}, params||{})).toString();
  const res = await fetch(API + '?' + qs);
  return res.json();
}

// ---------- 演目一覧 ----------
async function loadShows(){
  setStatus('読込中…');
  const r = await api('listShows');
  if (!r.ok){ setStatus('演目一覧の取得に失敗: '+r.error, 'err'); return; }
  const sel = $('showSelect');
  sel.innerHTML = '<option value="">演目を選択…</option>';
  r.shows.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.name; opt.textContent = s.name + (s.lastEditor ? '（最終更新: '+s.lastEditor+'）' : '');
    sel.appendChild(opt);
  });
  setStatus('');
}

$('showSelect').addEventListener('change', (e) => {
  if (e.target.value) selectShow(e.target.value);
});

$('newShowBtn').addEventListener('click', async () => {
  const name = prompt('新しい演目名を入力してください（例: Original, YOUNG BLOOD）');
  if (!name) return;
  const r = await api(null, null, 'POST', { action:'createShow', show:name, editor: $('editorName').value||'' });
  if (!r.ok){ alert('作成失敗: ' + r.error); return; }
  await loadShows();
  $('showSelect').value = name;
  selectShow(name);
});

async function selectShow(name){
  setStatus('読込中…');
  const r = await api('getCues', { show: name });
  if (!r.ok){ setStatus('取得失敗: '+r.error, 'err'); return; }
  state.show = name;
  state.cues = r.cues.map((c,i)=>Object.assign({}, c, {_id:i}));
  state.baseVersion = r.meta ? r.meta.lastUpdated : '';
  state.selectedIdx = -1;
  $('waveWrap').style.display = '';
  $('editArea').style.display = '';
  renderTable();
  renderMarkers();
  showDetail(-1);
  setStatus('読込完了（'+state.cues.length+'件）', 'ok');
  await loadCachedAudio(name);
}

// ---------- 音源キャッシュ(IndexedDB。演目ごとに1回選べば次回から自動読込) ----------
function audioDb_(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('lightingEditorAudio', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('files');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveCachedAudio(show, file){
  const db = await audioDb_();
  await new Promise((resolve, reject) => {
    const tx = db.transaction('files','readwrite');
    tx.objectStore('files').put({ name:file.name, blob:file }, show);
    tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
  });
}
async function loadCachedAudio(show){
  try{
    const db = await audioDb_();
    const rec = await new Promise((resolve, reject) => {
      const tx = db.transaction('files','readonly');
      const req = tx.objectStore('files').get(show);
      req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error);
    });
    if (!rec) { $('audioFileLabel').textContent = '（この演目の音源はまだキャッシュされていません。下で選択してください）'; return; }
    const buf = await rec.blob.arrayBuffer();
    const decoded = await audioCtx.decodeAudioData(buf);
    state.audioBuffer = decoded; state.duration = decoded.duration;
    state.playOffset = 0; state.isPlaying = false; $('playBtn').textContent = '▶ 再生';
    drawWave();
    $('audioFileLabel').textContent = '音源: ' + rec.name + '（キャッシュから自動読込）';
  } catch(e){ console.warn('audio cache load failed', e); }
}

// ---------- 保存 ----------
$('saveBtn').addEventListener('click', async () => {
  if (!state.show) return;
  const editor = $('editorName').value.trim();
  if (!editor){ alert('あなたの名前を入力してください（右上）'); return; }
  setStatus('保存中…');
  const cues = state.cues.map(c => ({ time:Number(c.time)||0, timeEnd: c.timeEnd===''||c.timeEnd==null?null:Number(c.timeEnd),
    part:c.part||'', fixtures:c.fixtures||'', color:c.color||'', intensity:c.intensity||'', memo:c.memo||'', measured:!!c.measured }));
  const r = await api(null, null, 'POST', { action:'saveCues', show: state.show, cues, editor, baseVersion: state.baseVersion });
  if (!r.ok){
    if (r.error === 'conflict'){
      alert((r.currentEditor||'別の誰か')+'さんが既に保存しているため、このまま保存すると上書きになります。再読込してから編集し直してください。');
    } else {
      alert('保存失敗: ' + r.error);
    }
    setStatus('保存失敗', 'err');
    return;
  }
  state.baseVersion = r.lastUpdated;
  setStatus('保存しました（'+r.count+'件）', 'ok');
  loadShows();
});

$('reloadBtn').addEventListener('click', () => { if (state.show) selectShow(state.show); });

// ---------- テーブル ----------
function renderTable(){
  const body = $('cueTableBody');
  body.innerHTML = '';
  const sorted = state.cues.slice().sort((a,b)=>(Number(a.time)||0)-(Number(b.time)||0));
  sorted.forEach((c) => {
    const tr = document.createElement('tr');
    tr.className = 'cueRow' + (c._id===state.selectedIdx?' selected':'') + (c.measured?' measured':'');
    tr.innerHTML = `<td class="num">${c._id+1}</td><td class="time num">${fmtTime(c.time)}</td>
      <td class="num">${c.timeEnd?fmtTime(c.timeEnd):''}</td><td>${escapeHtml(c.part||'')}</td>
      <td>${escapeHtml(c.fixtures||'')}</td><td>${escapeHtml(c.color||'')}</td><td>${escapeHtml(String(c.intensity||''))}</td>
      <td><button data-del="${c._id}" class="danger" style="padding:2px 8px;">×</button></td>`;
    tr.addEventListener('click', (e) => { if (e.target.dataset.del===undefined || e.target.dataset.del==='') showDetail(c._id); });
    body.appendChild(tr);
  });
  body.querySelectorAll('button[data-del]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); deleteCue(Number(btn.dataset.del)); });
  });
  $('cueCount').textContent = state.cues.length;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- 詳細パネル ----------
function showDetail(id){
  state.selectedIdx = id;
  renderTable(); renderMarkers();
  const c = state.cues.find(x=>x._id===id);
  if (!c){ $('noSelection').style.display=''; $('detailForm').style.display='none'; return; }
  $('noSelection').style.display='none'; $('detailForm').style.display='';
  $('f_time').value = c.time; $('f_timeEnd').value = c.timeEnd==null?'':c.timeEnd;
  $('f_part').value = c.part||''; syncFixtureCheckboxes(c.fixtures||'');
  $('f_color').value = c.color||''; $('f_intensity').value = c.intensity||'';
  $('f_memo').value = c.memo||''; $('f_measured').checked = !!c.measured;
}

function buildFixtureCheckboxes(){
  const group = $('f_fixtures_group');
  group.innerHTML = FIXTURE_NAMES.map(name => `
    <label data-fx="${name}">
      <input type="checkbox" value="${name}">${name}
    </label>`).join('');
  group.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const c = state.cues.find(x=>x._id===state.selectedIdx);
      if (!c) return;
      const checked = Array.from(group.querySelectorAll('input:checked')).map(i=>i.value);
      c.fixtures = checked.join(', ');
      group.querySelectorAll('label').forEach(l => l.classList.toggle('checked', l.querySelector('input').checked));
      renderTable(); renderMarkers();
    });
  });
}
function syncFixtureCheckboxes(fixturesStr){
  const active = String(fixturesStr||'').split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
  $('f_fixtures_group').querySelectorAll('label').forEach(l => {
    const name = l.dataset.fx;
    const on = active.some(f => f.indexOf(name)===0);
    l.querySelector('input').checked = on;
    l.classList.toggle('checked', on);
  });
}

['f_time','f_timeEnd','f_part','f_color','f_intensity','f_memo'].forEach(id=>{
  $(id).addEventListener('input', () => {
    const c = state.cues.find(x=>x._id===state.selectedIdx);
    if (!c) return;
    const key = id.replace('f_','');
    let v = $(id).value;
    if (key==='time'||key==='timeEnd') v = v===''? (key==='timeEnd'?null:0) : Number(v);
    c[key] = v;
    renderTable(); renderMarkers();
  });
});
$('f_measured').addEventListener('change', () => {
  const c = state.cues.find(x=>x._id===state.selectedIdx);
  if (c) c.measured = $('f_measured').checked;
  renderTable();
});

$('deleteCueBtn').addEventListener('click', () => deleteCue(state.selectedIdx));
function deleteCue(id){
  state.cues = state.cues.filter(c=>c._id!==id);
  if (state.selectedIdx===id) state.selectedIdx = -1;
  renderTable(); renderMarkers(); showDetail(-1);
}

$('addCueBtn').addEventListener('click', () => addCueAt(currentPlayTime()));

function nextId(){ return state.cues.length ? Math.max(...state.cues.map(c=>c._id))+1 : 0; }
function addCueAt(t){
  const c = { _id: nextId(), time: Math.round(t*100)/100, timeEnd:null, part:'', fixtures:'', color:'', intensity:'', memo:'', measured:false };
  state.cues.push(c);
  renderTable(); renderMarkers(); showDetail(c._id);
}

// ---------- 波形 ----------
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
$('audioFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  setStatus('音源を解析中…');
  const buf = await file.arrayBuffer();
  const decoded = await audioCtx.decodeAudioData(buf);
  state.audioBuffer = decoded;
  state.duration = decoded.duration;
  drawWave();
  if (state.show){
    await saveCachedAudio(state.show, file);
    $('audioFileLabel').textContent = '音源: ' + file.name + '（このブラウザに記憶しました）';
  }
  setStatus('');
});

function drawWave(){
  const canvas = $('wave');
  const buf = state.audioBuffer;
  const width = buf ? Math.max(800, Math.ceil(buf.duration * state.pxPerSec)) : 800;
  canvas.width = width;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (buf){
    const data = buf.getChannelData(0);
    const step = Math.ceil(data.length / width);
    const mid = canvas.height/2;
    ctx.fillStyle = '#3a4256';
    for (let x=0;x<width;x++){
      let min=1.0, max=-1.0;
      const start = x*step;
      for (let i=0;i<step;i++){
        const v = data[start+i]||0;
        if (v<min) min=v; if (v>max) max=v;
      }
      ctx.fillRect(x, mid + min*mid*0.9, 1, Math.max(1,(max-min)*mid*0.9));
    }
  }
  // 時間ルーラー
  ctx.strokeStyle = '#2a2f3a'; ctx.fillStyle = '#9aa2b1'; ctx.font = '10px sans-serif';
  const secStep = state.pxPerSec > 60 ? 1 : (state.pxPerSec > 20 ? 5 : 10);
  for (let s=0; s*state.pxPerSec < width; s+=secStep){
    const x = s*state.pxPerSec;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
    ctx.fillText(fmtTime(s), x+2, 10);
  }
  $('cueLayer').style.width = width+'px';
  $('cueLayer').style.height = canvas.height+'px';
  renderMarkers();
}

function renderMarkers(){
  const layer = $('cueLayer');
  layer.innerHTML = '';
  state.cues.forEach(c => {
    const el = document.createElement('div');
    el.className = 'cueMarker' + (c._id===state.selectedIdx?' selected':'');
    el.style.left = (Number(c.time)||0)*state.pxPerSec + 'px';
    el.innerHTML = '<div class="label">'+escapeHtml(c.part||'')+'</div>';
    el.addEventListener('mousedown', (ev) => startDrag(ev, c._id));
    el.addEventListener('click', (ev) => { ev.stopPropagation(); showDetail(c._id); });
    layer.appendChild(el);
  });
}

function startDrag(ev, id){
  ev.preventDefault(); ev.stopPropagation();
  const outer = $('timelineOuter');
  function onMove(e){
    const rect = $('wave').getBoundingClientRect();
    const x = e.clientX - rect.left + outer.scrollLeft;
    const t = Math.max(0, x / state.pxPerSec);
    const c = state.cues.find(c=>c._id===id);
    if (c){ c.time = Math.round(t*100)/100; }
    renderMarkers();
    if (state.selectedIdx===id){ $('f_time').value = c.time; }
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    renderTable();
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

$('wave').addEventListener('click', (e) => {
  const rect = $('wave').getBoundingClientRect();
  const x = e.clientX - rect.left;
  const t = x / state.pxPerSec;
  addCueAt(t);
});

// ---------- 再生 ----------
let sourceNode = null;
function currentPlayTime(){
  if (!state.isPlaying) return state.playOffset;
  return state.playOffset + (audioCtx.currentTime - state.playStart);
}
$('playBtn').addEventListener('click', () => {
  if (!state.audioBuffer) return;
  if (state.isPlaying){
    sourceNode.stop(); state.isPlaying=false; state.playOffset = currentPlayTime();
    $('playBtn').textContent = '▶ 再生';
  } else {
    sourceNode = audioCtx.createBufferSource();
    sourceNode.buffer = state.audioBuffer;
    sourceNode.connect(audioCtx.destination);
    sourceNode.start(0, state.playOffset % state.duration);
    state.playStart = audioCtx.currentTime;
    state.isPlaying = true;
    $('playBtn').textContent = '⏸ 停止';
  }
});
// ---------- ライトプレビュー(簡易) ----------
const COLOR_MAP = {
  '寒色':'#5fa8ff','暖色':'#ffb26e','青':'#3a6bff','青緑':'#33cbb0','白':'#ffffff','水色':'#7fd9ff',
  '無色':'#fff2df','無色（素）':'#fff2df','未定':'#8a8f9a','—':'#000000','': '#8a8f9a'
};
const INTENSITY_MAP = {
  '0':0,'極小':0.08,'小':0.22,'中':0.5,'高':0.78,'最大':1.0,'垂れる':0.28,
  '中（拍で抜く）':0.5,'中（瞬間）':0.6,'高（点滅）':0.8,'高（瞬間）':0.9,
  '小（顔が見える最低限）':0.16,'寒色（わずかに揺らす）':0.5
};
const FIXTURE_NAMES = ['SIDE-F','TOP','MH-S','MH-B','PIN','BLD','STR','LZR','HZ','BK','KEY'];
const WARM_MAP = { '暖色':1,'寒色':0,'青':0,'青緑':0,'白':0,'水色':0,'無色':0,'無色（素）':0,'未定':0,'—':0,'':0 };
buildFixtureCheckboxes();

function resolveToken(map, raw, fallback){
  raw = (raw===undefined||raw===null) ? '' : String(raw).trim();
  if (raw in map) return [map[raw], map[raw]];
  // "A→B" のような遷移表記を分割
  const arrowParts = raw.split(/[→〜]/).map(s=>s.trim());
  if (arrowParts.length >= 2){
    const a = map[arrowParts[0]] !== undefined ? map[arrowParts[0]] : fallback;
    const b = map[arrowParts[arrowParts.length-1]] !== undefined ? map[arrowParts[arrowParts.length-1]] : fallback;
    return [a, b];
  }
  return [fallback, fallback];
}

function hexToRgb(hex){
  hex = hex.replace('#','');
  if (hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const n = parseInt(hex,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function lerp(a,b,t){ return a+(b-a)*t; }
function lerpColor(c1,c2,t){
  const a=hexToRgb(c1), b=hexToRgb(c2);
  return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;
}

function activeSegmentAt(t){
  const sorted = state.cues.slice().sort((a,b)=>(Number(a.time)||0)-(Number(b.time)||0));
  let cur = null, idx = -1;
  for (let i=0;i<sorted.length;i++){
    if ((Number(sorted[i].time)||0) <= t) { cur = sorted[i]; idx = i; } else break;
  }
  if (!cur) return null;
  const segEnd = (cur.timeEnd!=null && cur.timeEnd!=='') ? Number(cur.timeEnd)
    : (sorted[idx+1] ? Number(sorted[idx+1].time) : state.duration);
  const segStart = Number(cur.time)||0;
  const progress = segEnd > segStart ? Math.min(1, Math.max(0, (t-segStart)/(segEnd-segStart))) : 0;
  return { cue: cur, progress };
}

// ---------- WebGLライトプレビュー(Taichi previzのcone/haze/floor/演者ロジックを移植) ----------
const VERT_SRC = `#version 300 es
void main(){
  vec2 p = vec2((gl_VertexID==2)?3.0:-1.0, (gl_VertexID==1)?3.0:-1.0);
  gl_Position = vec4(p,0.0,1.0);
}`;

const SCENE_FRAG = `#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 uResolution;
uniform float uTopI, uTopCos, uWingI, uPinI, uPinX, uSideI, uBeamI, uBlindI, uStrobeI, uLaserI, uBackI, uFloorI, uHaze, uWarm, uSweep, uLSweep, uLFan, uTime;
uniform vec3 uColor;

const float PZ = 5.2;
const vec3 pinApex = vec3(0.0, 8.2, -4.0);
const vec3 topC = vec3(0.86,0.93,1.0);
const vec3 wingC = vec3(0.92,0.95,1.0);
const vec3 pinC = vec3(1.0,0.97,0.90);
const vec3 warmC = vec3(1.0,0.62,0.28);
const vec3 floorC = vec3(0.40,0.48,0.60);
const vec3 backC = vec3(0.55,0.72,1.0);
const vec3 lc = vec3(0.20,0.90,0.75);

float px5(int k){
  if (k==0) return -4.2; if (k==1) return -1.3; if (k==2) return 0.0; if (k==3) return 1.3; return 4.2;
}

float cone(vec3 P, vec3 apex, vec3 d, float cosH, float L, float soft){
  vec3 v = P - apex; float dist = length(v)+1e-6; float al = dot(v/dist, d); float r = 0.0;
  if (al > cosH && dist < L){
    r = pow((al-cosH)/(1.0-cosH+1e-6), soft) * exp(-dist/L*1.1);
  }
  return r;
}

void main(){
  float W = uResolution.x, H = uResolution.y, asp = W/H;
  float tanf = tan(radians(33.0));
  vec3 cam = vec3(0.0,3.0,-5.5); vec3 fwd = normalize(vec3(0.0,-0.09,1.0));
  vec3 right = vec3(-1.0,0.0,0.0); vec3 up = vec3(0.0,1.0,0.0);
  float u = (gl_FragCoord.x/W - 0.5) * 2.0 * tanf * asp;
  float v = (gl_FragCoord.y/H - 0.5) * 2.0 * tanf;
  vec3 rd = normalize(fwd + right*u + up*v);
  vec3 hc = mix(uColor, vec3(1.0), 0.4);
  vec3 bc = uColor;

  vec3 air = vec3(0.0);
  float dt = 22.0/44.0; float tt = 0.3;
  vec3 pinDir = normalize(vec3(uPinX,1.7,PZ) - pinApex);
  for (int s=0; s<44; s++){
    vec3 P = cam + rd*tt; float hz = 0.05;
    air += hc * uHaze * hz * dt * 0.55;
    for (int k=0;k<5;k++){
      vec3 apex = vec3(px5(k), 9.2, PZ);
      air += topC * cone(P, apex, vec3(0.0,-1.0,0.0), uTopCos, 11.0, 1.4) * uTopI * hz * dt * 5.0;
    }
    for (int side=0; side<2; side++){
      float sgnx = 1.0 - 2.0*float(side);
      for (int r=0;r<2;r++){
        vec3 apex = vec3(sgnx*7.6, 1.4+float(r)*1.6, PZ-0.4+float(r)*1.2);
        air += wingC * cone(P, apex, vec3(-sgnx,0.0,0.0), 0.9990, 15.0, 1.1) * uWingI * hz * dt * 4.0;
      }
    }
    air += pinC * cone(P, pinApex, pinDir, 0.99955, 16.0, 1.2) * uPinI * hz * dt * 6.0;
    for (int side=0; side<2; side++){
      float sgnx = 1.0-2.0*float(side);
      for (int r=0;r<2;r++){
        vec3 apex = vec3(sgnx*8.5, 2.6+float(r)*2.4, 0.3);
        float a = uSweep + float(r)*0.4;
        vec3 d = normalize(vec3(-sgnx*cos(a), 0.1+sin(a)*0.5, 0.05));
        air += bc * cone(P, apex, d, 0.9994, 18.0, 1.0) * uSideI * hz * dt * 7.0;
      }
    }
    for (int k=0;k<5;k++){
      float ang = (float(k)-2.0)/2.0*0.55;
      vec3 apex = vec3((float(k)-2.0)*2.2, 8.6, 8.2);
      vec3 d = normalize(vec3(sin(ang)*0.5, -1.0, -0.42));
      air += vec3(0.7,0.82,1.0) * cone(P, apex, d, 0.9985, 14.0, 1.2) * uBeamI * hz * dt * 3.0;
    }
    for (int k=0;k<9;k++){
      float ang = (float(k)-4.0)/4.0*uLFan + uLSweep;
      vec3 lap = vec3(0.0,7.9,-2.4);
      vec3 ld = normalize(vec3(sin(ang)*0.9, -0.42+0.10*cos(ang), 0.70));
      air += lc * cone(P, lap, ld, 0.99988, 22.0, 1.0) * uLaserI * hz * dt * 9.0;
    }
    tt += dt;
  }

  vec3 bg = vec3(0.0);
  // BLD 客席向きブラインダー(直視)
  for (int k=0;k<7;k++){
    float bx = -6.0 + 2.0*float(k);
    vec3 bp = vec3(bx,2.3,-1.6); vec3 bdir = normalize(bp-cam); float al = dot(rd,bdir);
    if (al > 0.9985){
      vec3 bcol = mix(vec3(1.0,0.6,0.32), warmC, uWarm);
      bg += bcol * uBlindI * pow((al-0.9985)/0.0015, 2.0) * 2.2;
    }
  }
  // 床
  if (rd.y < -0.001){
    float tf = (0.02-cam.y)/rd.y;
    if (tf > 0.3){
      vec3 Pf = cam + rd*tf;
      if (abs(Pf.x) < 9.0 && Pf.z > -1.5 && Pf.z < 12.0){
        float fl = uFloorI*0.30;
        for (int k=0;k<5;k++){
          float d2 = (Pf.x-px5(k))*(Pf.x-px5(k)) + (Pf.z-PZ)*(Pf.z-PZ);
          fl += uTopI * exp(-d2/2.4) * 1.25;
        }
        fl += uWingI*0.30*exp(-((Pf.z-PZ)*(Pf.z-PZ))/14.0);
        fl += uSideI*0.20*exp(-((Pf.z-PZ)*(Pf.z-PZ))/20.0);
        fl += uBeamI*0.14*exp(-((Pf.z-PZ-1.5)*(Pf.z-PZ-1.5))/16.0);
        fl += uPinI*0.55*exp(-(((Pf.x-uPinX)*(Pf.x-uPinX)+(Pf.z-PZ)*(Pf.z-PZ)))/1.3);
        vec3 fc = mix(floorC, warmC*0.55, uWarm);
        bg += fc * fl * exp(-max(0.0,Pf.z)/15.0);
      }
    }
  }
  // 演者5人
  for (int k=0;k<5;k++){
    vec3 perf = vec3(px5(k), 1.7, PZ); vec3 pw = perf-cam; float pz = dot(pw,fwd);
    if (pz > 0.5){
      float sxp = (dot(pw,right)/pz/(tanf*asp)*0.5+0.5)*W;
      float syp_gl = (dot(pw,up)/pz/tanf*0.5+0.5)*H;
      float hh = H*0.5/pz/tanf*0.9; float ww = hh*0.27;
      float dy_gl = (gl_FragCoord.y - syp_gl)/hh; float dx = (gl_FragCoord.x - sxp)/ww;
      float e = dx*dx + dy_gl*dy_gl;
      if (e < 1.2){
        float inside = 1.0-min(1.0,e); float rim = clamp((e-0.55)/0.55, 0.0, 1.0);
        float top = max(0.0, 0.5+dy_gl);
        float lat = min(1.0, dx*dx);
        float pn = exp(-((px5(k)-uPinX)*(px5(k)-uPinX))/0.30);
        bg += backC * uBackI * rim * 1.6;
        bg += topC * uTopI * inside * top * 1.9;
        bg += wingC * uWingI * inside * (0.20+0.80*lat) * 1.7;
        bg += pinC * uPinI * pn * inside * 1.5;
      }
    }
  }
  float strobeFlicker = uStrobeI * (0.5+0.5*sin(uTime*30.0));
  vec3 col = bg + air + vec3(strobeFlicker*0.25);
  vec3 a = clamp(1.0-exp(-col*1.9), 0.0, 1.0);
  a = pow(a, vec3(1.05));
  outColor = vec4(a, 1.0);
}`;

const BLUR_FRAG = `#version 300 es
precision highp float;
out vec4 outColor;
uniform sampler2D uTex; uniform vec2 uResolution;
void main(){
  vec2 uv = gl_FragCoord.xy/uResolution;
  vec2 texel = 1.0/uResolution;
  vec3 sum = vec3(0.0); float wsum = 0.0;
  for (int dx=-4; dx<=4; dx++){
    for (int dy=-4; dy<=4; dy++){
      float w = exp(-float(dx*dx+dy*dy)/8.0);
      sum += texture(uTex, uv + vec2(float(dx),float(dy))*texel*1.6).rgb * w;
      wsum += w;
    }
  }
  outColor = vec4(sum/wsum, 1.0);
}`;

const COMPOSITE_FRAG = `#version 300 es
precision highp float;
out vec4 outColor;
uniform sampler2D uScene; uniform sampler2D uBlur; uniform vec2 uResolution;
void main(){
  vec2 uv = gl_FragCoord.xy/uResolution;
  vec3 a = texture(uScene, uv).rgb;
  vec3 bl = texture(uBlur, uv).rgb;
  vec3 outc = 1.0 - (1.0-a)*(1.0-bl*0.85);
  outColor = vec4(outc, 1.0);
}`;

let glState = null;
function initPreviewGL(){
  const canvas = $('preview');
  const gl = canvas.getContext('webgl2');
  if (!gl){ console.warn('WebGL2 not available'); return null; }
  function compile(type, src){
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
    return sh;
  }
  function link(vsSrc, fsSrc){
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
    return prog;
  }
  function makeFBO(w,h){
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { fbo, tex };
  }
  const sceneProg = link(VERT_SRC, SCENE_FRAG);
  const blurProg = link(VERT_SRC, BLUR_FRAG);
  const compProg = link(VERT_SRC, COMPOSITE_FRAG);
  const w = 480, h = 202;
  const sceneFBO = makeFBO(w,h), blurFBO = makeFBO(w,h);
  const vao = gl.createVertexArray(); // 属性なしのフルスクリーン三角形(gl_VertexID利用)
  glState = { gl, sceneProg, blurProg, compProg, sceneFBO, blurFBO, w, h, vao };
  return glState;
}

function u(gl, prog, name){ return gl.getUniformLocation(prog, name); }

function renderPreviewGL(){
  if (!glState) glState = initPreviewGL();
  if (!glState) return;
  const { gl, sceneProg, blurProg, compProg, sceneFBO, blurFBO, w, h, vao } = glState;
  const canvas = $('preview');
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const cssW = canvas.clientWidth||960, cssH = 180;
  if (canvas.width !== Math.round(cssW*dpr) || canvas.height !== Math.round(cssH*dpr)){
    canvas.width = Math.round(cssW*dpr); canvas.height = Math.round(cssH*dpr);
  }

  const t = currentPlayTime();
  const seg = state.show ? activeSegmentAt(t) : null;
  let uniforms = { topI:0, topCos:0.9975, wingI:0, pinI:0, pinX:0, sideI:0, beamI:0, blindI:0, strobeI:0, laserI:0, backI:0, floorI:0, haze:0.012, warm:0, sweep:t*0.45, lsweep:0.6*Math.sin(t*1.3), lfan:0.6, color:[0.5,0.6,0.7] };

  if (seg){
    const cue = seg.cue, p = seg.progress;
    const [c1,c2] = resolveToken(COLOR_MAP, cue.color, '#8a8f9a');
    const col = hexToRgb(lerpColor(c1,c2,p)).map(v=>v/255);
    const [i1,i2] = resolveToken(INTENSITY_MAP, cue.intensity, 0.4);
    const inten = lerp(Number(i1)||0, Number(i2)||0, p);
    const [w1,w2] = resolveToken(WARM_MAP, cue.color, 0);
    const warm = lerp(w1,w2,p);

    const fixtures = String(cue.fixtures||'').split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
    const has = (fn) => fixtures.some(f => f.indexOf(fn)===0);
    uniforms = {
      topI: has('TOP') ? 0.35+inten*0.55 : 0,
      topCos: 0.9975,
      wingI: has('SIDE-F') ? 0.25+inten*0.5 : 0,
      pinI: has('PIN') ? 0.5+inten*0.9 : 0,
      pinX: 0,
      sideI: has('MH-S') ? 0.2+inten*0.5 : 0,
      beamI: has('MH-B') ? 0.15+inten*0.5 : 0,
      blindI: has('BLD') ? 0.3+inten*0.9 : 0,
      strobeI: has('STR') ? 0.3+inten*0.7 : 0,
      laserI: has('LZR') ? 0.4+inten*0.6 : 0,
      backI: has('BK') ? 0.25+inten*0.6 : 0,
      floorI: 0.16+inten*0.12,
      haze: 0.012+inten*0.02+(has('HZ')?0.01:0),
      warm: warm,
      sweep: t*0.45 + 0.3*Math.sin(t*0.3),
      lsweep: 0.6*Math.sin(t*1.3),
      lfan: has('LZR') ? 0.8 : 0.4,
      color: col
    };
    $('previewPart').textContent = cue.part || '(無題)';
    const activeNames = FIXTURE_NAMES.filter(fn => fixtures.some(f => f.indexOf(fn)===0));
    $('previewFixtures').innerHTML = activeNames.map(n=>`<span class="fx">${n}</span>`).join('') || '<span class="fx">灯体なし</span>';
  } else {
    $('previewPart').textContent = '—'; $('previewFixtures').innerHTML = '';
  }

  gl.bindVertexArray(vao);

  // Pass A: シーン
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO.fbo);
  gl.viewport(0,0,w,h);
  gl.useProgram(sceneProg);
  gl.uniform2f(u(gl,sceneProg,'uResolution'), w, h);
  gl.uniform1f(u(gl,sceneProg,'uTopI'), uniforms.topI);
  gl.uniform1f(u(gl,sceneProg,'uTopCos'), uniforms.topCos);
  gl.uniform1f(u(gl,sceneProg,'uWingI'), uniforms.wingI);
  gl.uniform1f(u(gl,sceneProg,'uPinI'), uniforms.pinI);
  gl.uniform1f(u(gl,sceneProg,'uPinX'), uniforms.pinX);
  gl.uniform1f(u(gl,sceneProg,'uSideI'), uniforms.sideI);
  gl.uniform1f(u(gl,sceneProg,'uBeamI'), uniforms.beamI);
  gl.uniform1f(u(gl,sceneProg,'uBlindI'), uniforms.blindI);
  gl.uniform1f(u(gl,sceneProg,'uStrobeI'), uniforms.strobeI);
  gl.uniform1f(u(gl,sceneProg,'uLaserI'), uniforms.laserI);
  gl.uniform1f(u(gl,sceneProg,'uBackI'), uniforms.backI);
  gl.uniform1f(u(gl,sceneProg,'uFloorI'), uniforms.floorI);
  gl.uniform1f(u(gl,sceneProg,'uHaze'), uniforms.haze);
  gl.uniform1f(u(gl,sceneProg,'uWarm'), uniforms.warm);
  gl.uniform1f(u(gl,sceneProg,'uSweep'), uniforms.sweep);
  gl.uniform1f(u(gl,sceneProg,'uLSweep'), uniforms.lsweep);
  gl.uniform1f(u(gl,sceneProg,'uLFan'), uniforms.lfan);
  gl.uniform1f(u(gl,sceneProg,'uTime'), t);
  gl.uniform3f(u(gl,sceneProg,'uColor'), uniforms.color[0], uniforms.color[1], uniforms.color[2]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // Pass B: ブルーム用ブラー
  gl.bindFramebuffer(gl.FRAMEBUFFER, blurFBO.fbo);
  gl.viewport(0,0,w,h);
  gl.useProgram(blurProg);
  gl.uniform2f(u(gl,blurProg,'uResolution'), w, h);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex);
  gl.uniform1i(u(gl,blurProg,'uTex'), 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // Pass C: 合成→キャンバス本体
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.useProgram(compProg);
  gl.uniform2f(u(gl,compProg,'uResolution'), canvas.width, canvas.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex);
  gl.uniform1i(u(gl,compProg,'uScene'), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, blurFBO.tex);
  gl.uniform1i(u(gl,compProg,'uBlur'), 1);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function previewLoop(){
  renderPreviewGL();
  if (state.audioBuffer){
    $('timeLabel').textContent = fmtTime(currentPlayTime()) + ' / ' + fmtTime(state.duration);
  }
  requestAnimationFrame(previewLoop);
}
requestAnimationFrame(previewLoop);

loadShows();
</script>
